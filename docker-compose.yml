version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: agent-backend
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    depends_on:
      - ollama
    restart: unless-stopped

  api:
    build:
      context: ./api
    container_name: agent-api
    ports:
      - "8000:8000"
    env_file:
      - ./api/.env
    depends_on:
      - backend
    restart: unless-stopped

  mcp-server:
    build:
      context: ./mcp-server
    container_name: agent-mcp
    ports:
      - "9000:9000"
    env_file:
      - ./mcp-server/.env
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
